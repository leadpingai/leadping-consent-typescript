name: Build and publish consent SDK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consent-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: consent-sdk-dist
          path: dist/
          if-no-files-found: error
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import { readFileSync } from 'node:fs'; const { version } = JSON.parse(readFileSync('package.json')); if (process.env.RELEASE_TAG !== 'v' + version) throw new Error('Release tag must match package.json version');"
      - name: Package browser distribution and typed modules
        run: |
          mkdir -p release/site/sdk release/site/viewer
          cp -R dist/browser/. release/site/sdk/
          cp -R dist/viewer/. release/site/viewer/
          tar -czf release/leadping-consent-browser.tar.gz -C release/site .
          npm pack --pack-destination release
          cp dist/browser/* release/
          cd release
          sha256sum *.js *.map *.css *.txt *.tgz *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: leadping-consent-distribution
          path: release/*
          if-no-files-found: error

  publish-dist:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Remove previous distribution
        run: rm -rf dist
      - uses: actions/download-artifact@v4
        with:
          name: consent-sdk-dist
          path: dist
      - name: Commit distribution for jsDelivr
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo 'Main has advanced; its newer workflow will publish dist.'
            exit 0
          fi
          git config user.name leadpingai-bot
          git config user.email support@leadping.ai
          git add -A dist
          if git diff --cached --quiet; then
            echo 'Distribution is already current.'
            exit 0
          fi
          git commit -m "Publish consent SDK distribution [skip ci]"
          git push origin HEAD:main

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: leadping-consent-distribution
          path: release
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/*.js release/*.map release/*.css release/*.txt release/*.tgz release/*.tar.gz release/SHA256SUMS --clobber
