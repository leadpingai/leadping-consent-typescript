name: Build and publish consent SDK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consent-sdk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: consent-sdk-dist
          path: dist/
          if-no-files-found: error
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e "import { readFileSync } from 'node:fs'; const { version } = JSON.parse(readFileSync('package.json')); if (process.env.RELEASE_TAG !== 'v' + version) throw new Error('Release tag must match package.json version');"
      - name: Package browser distribution and typed modules
        run: |
          mkdir -p release/site/sdk
          cp -R dist/browser/. release/site/sdk/
          cp dist/leadping-consent.min.js* release/site/
          tar -czf release/leadping-consent-browser.tar.gz -C release/site .
          npm pack --pack-destination release
          cp dist/browser/* release/
          cd release
          sha256sum *.js *.map *.txt *.tgz *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: leadping-consent-distribution
          path: release/*
          if-no-files-found: error

  publish-npm:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install npm with trusted publishing support
        run: npm install --global npm@^11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: leadping-consent-distribution
          path: release
      - name: Publish tested package to npm
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          dist_tag=latest
          if [[ "$version" == *-* ]]; then dist_tag=next; fi
          npm publish "release/leadping-consent-${version}.tgz" --access public --tag "$dist_tag" --registry https://registry.npmjs.org

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: leadping-consent-distribution
          path: release
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/*.js release/*.map release/*.txt release/*.tgz release/*.tar.gz release/SHA256SUMS --clobber
